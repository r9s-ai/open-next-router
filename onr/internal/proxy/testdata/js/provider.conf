provider "policy" {
    defaults {
        upstream_config { base_url = "UPSTREAM_URL"; }
        auth { auth_bearer; }
        js_timeout 200ms;
        request {
            request_by_js_block {
                const body = JSON.parse(ctx.request.body);
                if (!Array.isArray(body.messages)) {
                    return ctx.reject(400, {error: "messages must be an array"});
                }
                body.messages.unshift({role: "system", content: "Be concise."});
                ctx.request.body = JSON.stringify(body);
                ctx.state.before = 1;
            }
            after_req_map {
                request_by_js_file after-map.js;
                json_set "$.mapped" "yes";
            }
        }
        response {
            response_headers_by_js_block {
                ctx.response.headers["x-policy"] = ["onr-js"];
            }
            response_by_js_block {
                const body = JSON.parse(ctx.response.body);
                delete body.usage;
                body.reviewed = true;
                ctx.response.body = JSON.stringify(body);
            }
            sse_event_by_js_block {
                ctx.state.events = (ctx.state.events || 0) + 1;
                const body = JSON.parse(ctx.event.data);
                if (body.usage) { return null; }
                body.reviewed = true;
                ctx.event.data = JSON.stringify(body);
                return ctx.event;
            }
        }
        log_by_js_block {
            ctx.log.info("attempt completed", {outcome: ctx.result.outcome});
        }
    }
    match api = "chat.completions" {
        upstream { set_path "/v1/chat/completions"; }
        metrics {
            usage_fact input token path="$.usage.prompt_tokens";
            usage_fact output token path="$.usage.completion_tokens";
        }
    }
}
