syntax "next-router/0.1";

provider "gemini" {
  defaults {
    upstream_config {
      # Gemini native base URL
      base_url = "https://generativelanguage.googleapis.com";
    }
    auth {
      auth_header_key "x-goog-api-key";
    }

    metrics {
    }
    models {
      models_mode gemini;
    }
    response {
      resp_passthrough;
    }
  }

  # Gemini native API: /v1beta/models/{model}:generateContent
  match api = "gemini.generateContent" {
    metrics {
      usage_extract gemini_generate_content;
      finish_reason_extract gemini_generate_content;
    }
    upstream {
      set_path template("/v1beta/models/${request.model_mapped}:generateContent");
      # set_query key $channel.key;
    }
  }

  # Gemini native SSE: /v1beta/models/{model}:streamGenerateContent?alt=sse
  match api = "gemini.streamGenerateContent" {
    metrics {
      usage_extract gemini_generate_content_stream;
      finish_reason_extract gemini_generate_content_stream;
    }
    upstream {
      set_path template("/v1beta/models/${request.model_mapped}:streamGenerateContent");
      set_query alt "sse";
      # set_query key $channel.key;
    }
  }

  # OpenAI 图像生成 -> Gemini generateContent(Nano Banana)。
  # req_map 侧做 prompt/n/size/quality/response_format 校验并转成 generateContent;
  # resp_map 侧把 inlineData 还原成 data[].b64_json,无图时返回 500 而不是空 data。
  # usage 已被 resp_map 归一成 OpenAI 形状(含 output_tokens_details.image_tokens),
  # 因此这里用 openai_images_generations 而不是 gemini_generate_content ——
  # metrics 在 resp_map 之后提取,$.usageMetadata 那时已不存在。
  match api = "images.generations" {
    metrics {
      usage_extract openai_images_generations;
    }
    request {
      req_map openai_images_to_gemini_generate_content;
    }
    response {
      resp_map gemini_to_openai_images;
    }
    upstream {
      set_path template("/v1beta/models/${request.model_mapped}:generateContent");
    }
  }

  match api = "chat.completions" {
    auth {
      auth_bearer;
    }
    upstream {
      set_path "/v1beta/openai/v1/chat/completions";
    }
    metrics {
      usage_extract openai_chat_completions;
      finish_reason_extract openai_chat_completions;
    }
  }

}
