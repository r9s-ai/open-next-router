syntax "next-router/0.1";

provider "minimax" {
  defaults {
    upstream_config {
      base_url = "https://api.minimax.io";
      # base_url = "https://api.minimax.chat"; # cn
    }
    auth {
      auth_bearer;
    }
    error {
      error_map openai;
    }
    response {
      resp_passthrough;
    }
  }

  match api = "chat.completions" {
    metrics {
      usage_extract openai_chat_completions;
      finish_reason_extract openai_chat_completions;
    }
    upstream {
      set_path "/v1/chat/completions";
    }
  }

  match api = "claude.messages" stream = false {
    metrics {
      usage_extract anthropic_messages;
      finish_reason_extract anthropic_messages;
    }
    upstream {
      set_path "/anthropic/v1/messages";
    }
  }

  match api = "claude.messages" stream = true {
    metrics {
      usage_extract anthropic_messages_stream;
      finish_reason_extract anthropic_messages_stream;
    }
    upstream {
      set_path "/anthropic/v1/messages";
    }
  }

  # Minimax 图像生成（/v1/image_generation）与 OpenAI 协议不兼容：请求用
  # aspect_ratio 或 width/height 而非 size、base64 而非 b64_json；响应的 data 是
  # 对象(image_urls/image_base64 两个平行数组)而非对象数组；业务错误藏在 HTTP 200
  # 的 base_resp 里。行为对齐 Go 适配器 relay/internal/channel/adaptor/minimax。
  match api = "images.generations" {
    request {
      # 通用边界用校验指令表达(缺失字段一律放行,由 req_map 补默认值)：
      # req_len 按 Unicode 码点计数,而 Go 的 len(prompt) 按字节算,中文 prompt
      # 会被 Go 误拒。
      req_required body "$.prompt";
      req_len body "$.prompt" max=1500;
      req_range body "$.n" min=1 max=9;
      req_enum body "$.response_format" "url" "b64_json" "base64";

      # size -> aspect_ratio | width/height、b64_json -> base64、n/response_format
      # 默认值等 minimax 特有的重塑在 builtin 内完成。
      req_map openai_images_to_minimax_image;
    }
    upstream {
      set_path "/v1/image_generation";
    }
    response {
      # base_resp.status_code != 0 这类藏在 HTTP 200 里的业务错误由 resp_map
      # builtin 判定并带出 minimax 的 status_msg。不用 error_when:它在 onr 侧
      # 没有运行时消费者(ErrorWhenRule.Matches 仅 relay 调用),配了也不生效。
      resp_map minimax_image_to_openai_images;
    }
    metrics {
      # minimax 图像响应没有 token 用量,按张数计费;此处读的是映射后的
      # OpenAI 形状(data 已是数组)。
      usage_fact image.generate image source="response" count_path="$.data[*]";
    }
  }

  match api = "audio.speech" {
    metrics {
      usage_extract openai_audio_speech;
    }
    upstream {
      set_path "/v1/t2a_v2";
    }
  }
}
