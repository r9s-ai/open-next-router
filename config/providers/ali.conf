syntax "next-router/0.1";

provider "ali" {
  defaults {
    upstream_config {
      base_url = "https://dashscope.aliyuncs.com";
    }
    auth {
      auth_bearer;
    }
    response {
      resp_passthrough;
    }
  }

  # 通义千问图像生成（DashScope multimodal-generation）与 OpenAI 协议不兼容：
  # 请求把 prompt 包进 input.messages 的对话结构、其余参数放 parameters，
  # size 用星号分隔；响应的图片 URL 嵌在 output.choices[].message.content[].image；
  # 业务错误藏在 HTTP 200 的顶层 code 里。行为对齐 Go 适配器
  # relay/internal/channel/adaptor/ali。
  match api = "images.generations" {
    request {
      # 通用边界用校验指令表达（缺失字段一律放行，由 req_map 补默认值）：
      # req_len 按 Unicode 码点计数，而 Go 的 len(prompt) 按字节算，
      # 中文 prompt 约 266 字就会被 Go 误拒。
      req_required body "$.prompt";
      req_len body "$.prompt" max=800;
      req_len body "$.negative_prompt" max=500;
      req_range body "$.n" min=1 max=1;
      req_range body "$.seed" min=0 max=2147483647;

      req_map openai_images_to_qwen_image;
    }
    upstream {
      set_path "/api/v1/services/aigc/multimodal-generation/generation";
    }
    response {
      resp_map qwen_image_to_openai_images;

      # DashScope 只返回图片链接，从不返回内联内容。请求 b64_json 的调用方
      # 只能靠抓取链接来满足，这正是 Go 适配器下载图片再 base64 的原因。
      # 抓取失败会保留 URL：拿到链接的调用方仍能自取，拿到失败的则一无所有。
      resp_inline_url path="$.data[*].url" set="b64_json"
                      when_request="$.response_format" when_eq="b64_json";
    }
    metrics {
      # 按张计费,定义见 modes/usage_modes.conf 的 image_generations_by_picture。
      usage_extract image_generations_by_picture;
    }
  }
}
