name: Security scans

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: go
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.1

      - name: Analyze code
        uses: github/codeql-action/analyze@v4.38.1

  go-vulnerabilities:
    name: Go vulnerabilities (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: onr
            path: .
          - name: onr-core
            path: onr-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan dependencies
        working-directory: ${{ matrix.module.path }}
        run: |
          govulncheck_path="$(go env GOPATH)/bin/govulncheck"
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          "$govulncheck_path" -format json ./... > "$report"
          set +e
          python3 "$GITHUB_WORKSPACE/tools/govulncheck_allowlist.py" "$report"
          filter_status=$?
          set -e
          case "$filter_status" in
            0) exit 0 ;;
            1) "$govulncheck_path" ./... ;;
            *) echo "failed to validate govulncheck JSON report" >&2; exit "$filter_status" ;;
          esac
